
plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

android {
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        vectorDrawables.useSupportLibrary = true
        applicationId "com.bhola.desiKahaniya"
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 38
        versionName "38"
        multiDexEnabled true

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint {
        checkReleaseBuilds false
    }
    namespace 'com.bhola.desiKahaniya'
}

dependencies {

    implementation fileTree(dir: "libs", include: ["*.jar"])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'com.google.android.material:material:1.14.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    // androidx.multidex not needed: minSdk 23 uses native multidex. Its only
    // reference was an accidental BuildConfig import (see Collection_GridView).


    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.facebook.android:audience-network-sdk:6.21.0'
    implementation 'com.google.ads.mediation:facebook:6.21.0.4'
    // mediation-test-suite removed: it is debug-only tooling that was being shipped
    // in release builds, and nothing in the app referenced it.
    implementation project(':nativetemplates')

    // Volley is used directly by Collection_GridView / StoryPage but used to arrive
    // only transitively via mediation-test-suite. Declared explicitly now.
    implementation 'com.android.volley:volley:1.2.1'

    //Firebase
    implementation platform('com.google.firebase:firebase-bom:34.16.0')
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-storage'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'com.google.firebase:firebase-crashlytics'
    implementation 'com.google.firebase:firebase-analytics'
    // firebase-ui-database removed: no FirebaseRecyclerAdapter/FirebaseListAdapter
    // usage anywhere in the app, and upstream is near-dormant.

    implementation 'com.google.android.play:review:2.0.2'
    implementation 'com.google.android.play:asset-delivery:2.3.0'
    implementation 'com.google.android.play:app-update:2.1.0'
    implementation 'com.google.android.gms:play-services-tasks:18.4.1'


//    Jsoup
    implementation 'com.github.fornewid:neumorphism:0.3.2'
    // Lottie Animation
    implementation "com.airbnb.android:lottie:6.7.1"

    // lifecycle-extensions removed: deprecated artifact, frozen at 2.2.0, unused.
    implementation "androidx.lifecycle:lifecycle-runtime:2.11.0"
    implementation 'androidx.lifecycle:lifecycle-process:2.11.0'
    //noinspection LifecycleAnnotationProcessorWithJava8
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:2.11.0"

    implementation "com.android.billingclient:billing:9.1.0"

    implementation 'androidx.media:media:1.8.0'
    implementation 'androidx.activity:activity:1.13.0'

    // Schedules the local pre-expiry membership reminder notification.
    implementation 'androidx.work:work-runtime:2.10.1'

}
